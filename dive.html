<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#04050a" />
<meta name="description" content="NEUROBYTE descent — a first-person fall through the connectome; steer with the pointer, hold to accelerate." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060b'/%3E%3Cg stroke='%2335c9e6' stroke-width='1.4' fill='none'%3E%3Cline x1='16' y1='16' x2='4' y2='7'/%3E%3Cline x1='16' y1='16' x2='28' y2='6'/%3E%3Cline x1='16' y1='16' x2='27' y2='24'/%3E%3Cline x1='16' y1='16' x2='6' y2='26'/%3E%3Cline x1='16' y1='16' x2='16' y2='30'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%2382e6ff'/%3E%3C/svg%3E" />
<title>NEUROBYTE — descent</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04050a; }
  body { font-family: "SFMono-Regular", ui-monospace, "Courier New", monospace; color: #9fbccb; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; display: block; z-index: 1; cursor: none; touch-action: none; }
  #top { position: fixed; left: 26px; top: 22px; z-index: 3; pointer-events: none; }
  #top h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.06em; color: #c7ddea; text-shadow: 0 0 8px #1ab0ff44; }
  #top p { font-size: 11px; color: #56727f; margin-top: 4px; letter-spacing: 0.1em; }
  #top .spec { color: #445e6a; margin-top: 2px; }
  #nav { position: fixed; right: 16px; bottom: 20px; z-index: 4; display: flex; flex-direction: column; gap: 1px; align-items: flex-end; font-size: 10.5px; letter-spacing: 0.16em; }
  #nav a { color: #6f9fae; text-decoration: none; padding: 3px 9px; border-right: 2px solid transparent; transition: color .2s ease, border-color .2s ease; }
  #nav a:hover, #nav a.here { color: #cfeef6; border-color: #35c9e6; }
  #hint { position: fixed; left: 26px; bottom: 22px; z-index: 3; color: #4a6672; font-size: 11px; letter-spacing: 0.1em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><h1>DESCENT</h1><p>// falling through the connectome — move to steer, hold to accelerate</p><p class="spec" id="spec"></p></div>
<nav id="nav">
  <a href="index.html">CORTEX</a>
  <a href="synapse.html">CONNECTOME</a>
  <a href="pulse.html">LATENCY</a>
  <a href="dive.html" class="here">DESCENT</a>
</nav>
<div id="hint">scroll to set cruising speed</div>

<script>
(() => {
"use strict";
const cv = document.getElementById("c");
const x = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SEED = (() => {
  const q = new URLSearchParams(location.search).get("seed");
  if (q && /^[0-9a-z]+$/i.test(q)) return parseInt(q, 36) >>> 0;
  let s = localStorage.getItem("nb_specimen");
  if (!s) { s = (Math.random() * 4294967296 >>> 0).toString(36); localStorage.setItem("nb_specimen", s); }
  return parseInt(s, 36) >>> 0;
})();
const specEl = document.getElementById("spec");
if (specEl) specEl.textContent = "specimen #" + SEED.toString(36).toUpperCase().padStart(6, "0").slice(-6);

const F = 620;              // focal length
const NEAR = 12, FAR = 1400;
let N = 900;
let px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);

function respawn(i, far) {
  px[i] = (Math.random() * 2 - 1) * 900;
  py[i] = (Math.random() * 2 - 1) * 900;
  pz[i] = far ? FAR - Math.random() * 120 : Math.random() * FAR;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || document.documentElement.clientWidth || 1280;
  H = window.innerHeight || document.documentElement.clientHeight || 720;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H / 2;
  N = Math.min(1500, Math.round((W * H) / 1100));
  px = new Float32Array(N); py = new Float32Array(N); pz = new Float32Array(N);
  for (let i = 0; i < N; i++) respawn(i, false);
}
window.addEventListener("resize", resize);

let steerX = 0, steerY = 0, tgtX = 0, tgtY = 0;
// reduced-motion: no autopilot — the descent only moves while the pointer is held
let base = REDUCED ? 0 : 160, boost = 0;
addEventListener("pointermove", (e) => {
  tgtX = (e.clientX / W - 0.5) * 420;
  tgtY = (e.clientY / H - 0.5) * 420;
});
addEventListener("pointerdown", () => (boost = 1));
addEventListener("pointerup", () => (boost = 0));
addEventListener("pointerleave", () => (boost = 0));
addEventListener("wheel", (e) => {
  base = Math.max(REDUCED ? 0 : 40, Math.min(520, base + (e.deltaY > 0 ? -20 : 20)));
  e.preventDefault();
}, { passive: false });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;

  steerX += (tgtX - steerX) * Math.min(1, dt * 3);
  steerY += (tgtY - steerY) * Math.min(1, dt * 3);
  const speed = base + boost * 420;

  // motion-blur wash
  x.fillStyle = "rgba(4,5,10,0.30)";
  x.fillRect(0, 0, W, H);

  // project + gather visible
  const sx = new Float32Array(N), sy = new Float32Array(N), sb = new Float32Array(N);
  const vis = [];
  for (let i = 0; i < N; i++) {
    pz[i] -= speed * dt;
    if (pz[i] <= NEAR) { respawn(i, true); continue; }
    const s = F / pz[i];
    const X = cx + (px[i] - steerX) * s;
    const Y = cy + (py[i] - steerY) * s;
    if (X < -60 || X > W + 60 || Y < -60 || Y > H + 60) continue;
    sx[i] = X; sy[i] = Y;
    sb[i] = Math.max(0, 1 - pz[i] / FAR);
    vis.push(i);
  }

  // links between near-ish neighbours (cheap: check a window of index order after sort by x)
  vis.sort((a, b) => sx[a] - sx[b]);
  x.lineWidth = 1;
  for (let a = 0; a < vis.length; a++) {
    const i = vis[a];
    for (let b = a + 1; b < vis.length && b < a + 7; b++) {
      const j = vis[b];
      const dx = sx[i] - sx[j], dy = sy[i] - sy[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > 9000) continue;
      const e = Math.min(sb[i], sb[j]);
      x.strokeStyle = "rgba(120,180,220," + (0.05 + e * 0.22).toFixed(3) + ")";
      x.beginPath(); x.moveTo(sx[i], sy[i]); x.lineTo(sx[j], sy[j]); x.stroke();
    }
  }

  // neurons
  for (const i of vis) {
    const b = sb[i];
    const r = 0.6 + b * b * 3.4;
    x.fillStyle = "rgba(" + (90 + b * 120 | 0) + "," + (170 + b * 70 | 0) + "," + (210 + b * 40 | 0) + "," + (0.15 + b * 0.7).toFixed(3) + ")";
    x.beginPath(); x.arc(sx[i], sy[i], r, 0, 6.2832); x.fill();
  }

  // reticle
  x.strokeStyle = "rgba(120,200,220,0.25)";
  x.lineWidth = 1;
  x.beginPath(); x.arc(cx, cy, 10, 0, 6.2832); x.stroke();

  x.textAlign = "left";
  x.font = "500 11px 'SFMono-Regular', ui-monospace, monospace";
  x.fillStyle = "rgba(110,150,165,0.7)";
  x.fillText("depth " + Math.round(speed) + " u/s   ·   " + vis.length + " neurons in frame", 26, H - 40);

  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
