<script>
(() => {
"use strict";

// ------------------------------------------------------------------ setup
const glcanvas = document.getElementById("gl");
const hudcanvas = document.getElementById("hud");
const boot = document.getElementById("boot");
const hud = hudcanvas.getContext("2d");
const gl = glcanvas.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true });

if (!gl) {
  boot.textContent = "WebGL2 not available — try a desktop browser.";
  return;
}
const extCBF = gl.getExtension("EXT_color_buffer_float");
const SCENE_INTERNAL = extCBF ? gl.RGBA16F : gl.RGBA8;
const SCENE_TYPE = extCBF ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// deterministic per-visitor "specimen" seed — shareable via ?seed=
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SEED = (() => {
  const q = new URLSearchParams(location.search).get("seed");
  if (q && /^[0-9a-z]+$/i.test(q)) return parseInt(q, 36) >>> 0;
  let s = localStorage.getItem("nb_specimen");
  if (!s) { s = (Math.random() * 4294967296 >>> 0).toString(36); localStorage.setItem("nb_specimen", s); }
  return parseInt(s, 36) >>> 0;
})();
let SPECIMEN = SEED.toString(36).toUpperCase().padStart(6, "0").slice(-6);
let rand = mulberry32(SEED);

let DPR = Math.min(window.devicePixelRatio || 1, 1.6);
let W = 0, H = 0, BW = 0, BH = 0;

// ------------------------------------------------------------------ math
const V = {
  sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
};
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0];
}
function lookAt(eye, center, up) {
  const z = V.norm(V.sub(eye, center));
  const x = V.norm(V.cross(up, z));
  const y = V.cross(z, x);
  return [
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -V.dot(x, eye), -V.dot(y, eye), -V.dot(z, eye), 1,
  ];
}
function mul(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
  }
  return o;
}
function invert(m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
  const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
  const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
  const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
  const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
  const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (!det) return m.slice();
  det = 1 / det;
  return [
    (a11*b11-a12*b10+a13*b09)*det, (a02*b10-a01*b11-a03*b09)*det, (a31*b05-a32*b04+a33*b03)*det, (a22*b04-a21*b05-a23*b03)*det,
    (a12*b08-a10*b11-a13*b07)*det, (a00*b11-a02*b08+a03*b07)*det, (a32*b02-a30*b05-a33*b01)*det, (a20*b05-a22*b02+a23*b01)*det,
    (a10*b10-a11*b08+a13*b06)*det, (a01*b08-a00*b10-a03*b06)*det, (a30*b04-a31*b02+a33*b00)*det, (a21*b02-a20*b04-a23*b00)*det,
    (a11*b07-a10*b09-a12*b06)*det, (a00*b09-a01*b07+a02*b06)*det, (a31*b01-a30*b03-a32*b00)*det, (a20*b03-a21*b01+a22*b00)*det,
  ];
}
function xform(m, v) {
  const x=v[0], y=v[1], z=v[2], w=v[3];
  return [
    m[0]*x+m[4]*y+m[8]*z+m[12]*w,
    m[1]*x+m[5]*y+m[9]*z+m[13]*w,
    m[2]*x+m[6]*y+m[10]*z+m[14]*w,
    m[3]*x+m[7]*y+m[11]*z+m[15]*w,
  ];
}

// ------------------------------------------------------------------ brain geometry
let N = 0;
let POS, PHASE, ADJ;
let EDGES;

function makeBrain(target) {
  const pos = new Float32Array(target * 3);
  const phase = new Float32Array(target * 2);
  let i = 0, guard = 0;
  const A = 1.32, B = 0.95, C = 1.06;            // cerebrum ellipsoid
  const cbl = [0, -0.55, -0.86], cblR = [0.56, 0.33, 0.42];
  while (i < target && guard < target * 60) {
    guard++;
    const x = (rand()*2-1)*1.4;
    const y = (rand()*2-1)*1.05;
    const z = (rand()*2-1)*1.2;
    const rr = (x*x)/(A*A) + (y*y)/(B*B) + (z*z)/(C*C);
    const inCer = rr <= 1;
    const dcx = x-cbl[0], dcy = y-cbl[1], dcz = z-cbl[2];
    const rc = (dcx*dcx)/(cblR[0]*cblR[0]) + (dcy*dcy)/(cblR[1]*cblR[1]) + (dcz*dcz)/(cblR[2]*cblR[2]);
    const inCbl = rc <= 1;
    if (!inCer && !inCbl) continue;
    // longitudinal fissure
    if (inCer && !inCbl && Math.abs(x) < 0.055 && y > -0.15 && rand() < 0.9) continue;
    // cortex shell bias (denser near the surface, but keep some interior)
    if (inCer && !inCbl && rand() > (0.32 + rr * rr * 0.7)) continue;
    const wob = 1 + 0.03 * Math.sin(x*9 + y*7) * Math.cos(z*8);
    pos[i*3]   = x * wob;
    pos[i*3+1] = y * wob;
    pos[i*3+2] = z * wob;
    phase[i*2]   = rand() * 6.2832;
    phase[i*2+1] = rand() * 0.9;
    i++;
  }
  return { pos: pos.subarray(0, i*3), phase: phase.subarray(0, i*2), count: i };
}

function buildEdges(pos, n, k, maxDist) {
  const cell = maxDist;
  const grid = new Map();
  const key = (a, b, c) => (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
  for (let i = 0; i < n; i++) {
    const cx = Math.floor(pos[i*3]/cell), cy = Math.floor(pos[i*3+1]/cell), cz = Math.floor(pos[i*3+2]/cell);
    const kk = key(cx, cy, cz);
    let arr = grid.get(kk); if (!arr) { arr = []; grid.set(kk, arr); }
    arr.push(i);
  }
  const seen = new Set();
  const edges = [];
  const adj = Array.from({ length: n }, () => []);
  const cand = [];
  const md2 = maxDist * maxDist;
  for (let i = 0; i < n; i++) {
    const cx = Math.floor(pos[i*3]/cell), cy = Math.floor(pos[i*3+1]/cell), cz = Math.floor(pos[i*3+2]/cell);
    cand.length = 0;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const arr = grid.get(key(cx+dx, cy+dy, cz+dz)); if (!arr) continue;
      for (let a = 0; a < arr.length; a++) {
        const j = arr[a]; if (j === i) continue;
        const ex = pos[j*3]-pos[i*3], ey = pos[j*3+1]-pos[i*3+1], ez = pos[j*3+2]-pos[i*3+2];
        const d2 = ex*ex + ey*ey + ez*ez;
        if (d2 <= md2) cand.push(d2, j);
      }
    }
    // partial selection of k nearest
    const pairs = [];
    for (let c = 0; c < cand.length; c += 2) pairs.push([cand[c], cand[c+1]]);
    pairs.sort((p, q) => p[0] - q[0]);
    const lim = Math.min(k, pairs.length);
    for (let c = 0; c < lim; c++) {
      const j = pairs[c][1];
      const lo = Math.min(i, j), hi = Math.max(i, j);
      const ek = lo * n + hi;
      if (seen.has(ek)) continue;
      seen.add(ek);
      edges.push(lo, hi);
      const dist = Math.sqrt(pairs[c][0]);
      adj[i].push(j, dist);
      adj[j].push(i, dist);
    }
  }
  return { edges: new Uint32Array(edges), adj };
}

// ------------------------------------------------------------------ simulation state
let POT, REFR, INBOX;
const THRESH = 1.0, WEIGHT = 0.58, LEAK = 2.3, REFR_T = 0.18, SPIKE_V = 1.2;
let gAct = 0;                       // smoothed global activity (0..1)
let spikesThisFrame = 0;

// traveling pulses
const MAXP = 9000;
let pFrom = new Int32Array(MAXP), pTo = new Int32Array(MAXP), pT = new Float32Array(MAXP), pDur = new Float32Array(MAXP);
let pCount = 0;
const pulseGeo = new Float32Array(MAXP * 4);

function spawnPulse(a, b, d) {
  if (pCount >= MAXP) return;
  pFrom[pCount] = a; pTo[pCount] = b; pT[pCount] = 0;
  pDur[pCount] = 0.10 + d * 1.4;   // finite conduction → a visible travelling front, not a flash
  pCount++;
}
function updatePulses(dt) {
  let w = 0;
  for (let r = 0; r < pCount; r++) {
    let t = pT[r] + dt / pDur[r];
    if (t >= 1) {
      const to = pTo[r];
      INBOX[to] += REFR[to] > 0 ? WEIGHT * 0.25 : WEIGHT;
      continue;
    }
    pFrom[w] = pFrom[r]; pTo[w] = pTo[r]; pT[w] = t; pDur[w] = pDur[r];
    const a = pFrom[r], b = pTo[r];
    const px = POS[a*3] + (POS[b*3] - POS[a*3]) * t;
    const py = POS[a*3+1] + (POS[b*3+1] - POS[a*3+1]) * t;
    const pz = POS[a*3+2] + (POS[b*3+2] - POS[a*3+2]) * t;
    pulseGeo[w*4] = px; pulseGeo[w*4+1] = py; pulseGeo[w*4+2] = pz; pulseGeo[w*4+3] = t;
    w++;
  }
  pCount = w;
}

function step(h, effThresh) {
  for (let i = 0; i < N; i++) {
    let v = POT[i] + INBOX[i];
    INBOX[i] = 0;
    if (REFR[i] > 0) {
      REFR[i] -= h;
      v *= 0.70;
    } else {
      v += (0 - v) * LEAK * h;
      if (v >= effThresh) {
        v = SPIKE_V;
        REFR[i] = REFR_T;
        spikesThisFrame++;
        const list = ADJ[i];
        for (let a = 0; a < list.length; a += 2) spawnPulse(i, list[a], list[a+1]);
        if (audioOn) maybeBlip();
      }
    }
    POT[i] = v;
  }
}

// ------------------------------------------------------------------ camera + interaction
let yaw = 0.6, pitch = 0.22, dist = 4.9;
let dragging = false, dragMoved = false, lastX = 0, lastY = 0, downT = 0, downX = 0, downY = 0;
let hovering = false, mx = 0, my = 0;
let lastInteract = performance.now();
let forcedDream = false;
let BOOST = false;
let flash = 0;
let invVP = null, eye = [0, 0, 0];
const shocks = [];

function eyePos() {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return [dist * cp * Math.sin(yaw), dist * sp, dist * cp * Math.cos(yaw)];
}
function rayFromScreen(sx, sy) {
  const ndcx = (sx / W) * 2 - 1;
  const ndcy = -((sy / H) * 2 - 1);
  const near = xform(invVP, [ndcx, ndcy, -1, 1]);
  const far = xform(invVP, [ndcx, ndcy, 1, 1]);
  const p0 = [near[0]/near[3], near[1]/near[3], near[2]/near[3]];
  const p1 = [far[0]/far[3], far[1]/far[3], far[2]/far[3]];
  return { o: eye.slice(), d: V.norm(V.sub(p1, p0)) };
}
function applyProbe(strength, sigma, ray) {
  const s2 = sigma * sigma;
  const o = ray.o, d = ray.d;
  for (let i = 0; i < N; i++) {
    const wx = POS[i*3]-o[0], wy = POS[i*3+1]-o[1], wz = POS[i*3+2]-o[2];
    const proj = wx*d[0] + wy*d[1] + wz*d[2];
    if (proj < 0) continue;
    const cx = wx - d[0]*proj, cy = wy - d[1]*proj, cz = wz - d[2]*proj;
    const dd = cx*cx + cy*cy + cz*cz;
    if (dd > s2 * 6) continue;
    INBOX[i] += strength * Math.exp(-dd / s2);
  }
}
function surge(amt) {
  const count = (N * 0.10) | 0;
  for (let c = 0; c < count; c++) INBOX[(Math.random() * N) | 0] += 1.7 * amt;
  flash = Math.min(0.5, flash + 0.22 * amt);
  shocks.push({ x: W / 2, y: H / 2, t: 0 });
  if (audioOn) swell();
}

// region readout
let regionLabel = "", regionScreen = null;
function nearestNeuronToRay(ray) {
  const o = ray.o, d = ray.d;
  let best = -1, bd = 0.42 * 0.42;
  for (let i = 0; i < N; i++) {
    const wx = POS[i*3]-o[0], wy = POS[i*3+1]-o[1], wz = POS[i*3+2]-o[2];
    const p = wx*d[0] + wy*d[1] + wz*d[2];
    if (p < 0) continue;
    const cx = wx - d[0]*p, cy = wy - d[1]*p, cz = wz - d[2]*p;
    const dd = cx*cx + cy*cy + cz*cz;
    if (dd < bd) { bd = dd; best = i; }
  }
  return best < 0 ? null : [POS[best*3], POS[best*3+1], POS[best*3+2]];
}
function classifyRegion(x, y, z) {
  if ((x*x)/0.36 + ((y+0.55)*(y+0.55))/0.16 + ((z+0.86)*(z+0.86))/0.25 <= 1.15) return "cerebellum";
  if (y < -0.28 && Math.abs(x) < 0.3 && z > -0.4 && z < 0.25) return "brain stem";
  if (Math.abs(x) > 0.6 && y < 0.12) return (x < 0 ? "left" : "right") + " temporal lobe";
  if (z > 0.42) return "frontal lobe";
  if (z < -0.42) return "occipital lobe";
  if (y > 0.34) return "parietal lobe";
  return "association cortex";
}
function projectPoint(p, vp) {
  const c = xform(vp, [p[0], p[1], p[2], 1]);
  if (c[3] <= 0) return null;
  return [(c[0]/c[3] * 0.5 + 0.5) * W, (1 - (c[1]/c[3] * 0.5 + 0.5)) * H];
}

glcanvas.addEventListener("pointerdown", (e) => {
  glcanvas.setPointerCapture(e.pointerId);
  dragging = true; dragMoved = false;
  lastX = e.clientX; lastY = e.clientY;
  downT = performance.now(); downX = e.clientX; downY = e.clientY;
  lastInteract = downT;
  ensureAudio();
});
glcanvas.addEventListener("pointermove", (e) => {
  mx = e.clientX; my = e.clientY; hovering = true;
  lastInteract = performance.now();
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) dragMoved = true;
    yaw += dx * 0.005;
    pitch = Math.max(-1.35, Math.min(1.35, pitch + dy * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  }
});
glcanvas.addEventListener("pointerup", (e) => {
  dragging = false;
  if (!dragMoved && performance.now() - downT < 320) {
    const ray = rayFromScreen(e.clientX, e.clientY);
    applyProbe(2.0, 0.17, ray);
    flash = Math.min(0.5, flash + 0.05);
    shocks.push({ x: e.clientX, y: e.clientY, t: 0 });
    if (audioOn) burst();
  }
});
glcanvas.addEventListener("pointerleave", () => { hovering = false; });
glcanvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  dist = Math.max(2.6, Math.min(12, dist * Math.exp(e.deltaY * 0.0012)));
  lastInteract = performance.now();
}, { passive: false });
addEventListener("keydown", (e) => {
  lastInteract = performance.now();
  const k = e.key.toLowerCase();
  if (k === " " || e.code === "Space") { e.preventDefault(); surge(1.0); }
  else if (k === "d") forcedDream = !forcedDream;
  else if (k === "m") { audioOn = !audioOn; ensureAudio(); if (master) master.gain.value = audioOn ? 0.22 : 0; }
  else if (k === "r") regrow(true);
  else if (k === "b") BOOST = !BOOST;
  else if (k === "p") saveScan();
  else if (k === "s") shareSpecimen();
  else if (k === "h" || k === "?") helpVisible = !helpVisible;
});

function saveScan() {
  const out = document.createElement("canvas");
  out.width = BW; out.height = BH;
  const o = out.getContext("2d");
  o.drawImage(glcanvas, 0, 0);
  o.drawImage(hudcanvas, 0, 0);
  o.fillStyle = "rgba(120,160,175,0.8)";
  o.font = `${12 * DPR}px "SFMono-Regular", ui-monospace, monospace`;
  o.textAlign = "right";
  o.fillText("neurobyte · specimen #" + SPECIMEN, BW - 22 * DPR, BH - 16 * DPR);
  out.toBlob((b) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `neurobyte-scan-${SPECIMEN}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, "image/png");
  toast("scan saved · specimen #" + SPECIMEN);
}
function shareSpecimen() {
  const url = location.origin + location.pathname + "?seed=" + SEED.toString(36);
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("share link copied"), () => toast(url));
  else toast(url);
}
let toastMsg = "", toastUntil = 0;
function toast(m) { toastMsg = m; toastUntil = performance.now() + 2600; }

// ------------------------------------------------------------------ audio
let actx = null, master = null, delay = null, audioOn = false, audioReady = false;
let lastBlip = 0, blipRate = 0;
const SCALE = [220, 247.5, 293.33, 330, 391.11, 440, 495, 586.66];
function ensureAudio() {
  if (audioReady) { if (actx.state === "suspended") actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = audioOn ? 0.22 : 0;
    const comp = actx.createDynamicsCompressor();
    comp.connect(master); master.connect(actx.destination);
    delay = actx.createDelay(1.0); delay.delayTime.value = 0.27;
    const fb = actx.createGain(); fb.gain.value = 0.34;
    delay.connect(fb); fb.connect(delay); delay.connect(comp);
    window._dry = comp;
    audioReady = true;
  } catch (err) { audioReady = false; }
}
function maybeBlip() {
  const now = performance.now();
  blipRate *= 0.9;
  if (blipRate > 16) return;
  if (now - lastBlip < 45) return;
  if (Math.random() > 0.12) return;
  lastBlip = now; blipRate += 1;
  const f = SCALE[(Math.random() * SCALE.length) | 0] * (Math.random() < 0.3 ? 2 : 1);
  tone(f, 0.16, Math.random() < 0.5 ? "sine" : "triangle");
}
function tone(freq, gain, type) {
  if (!audioReady) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = 0;
  g.gain.linearRampToValueAtTime(gain, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
  o.connect(g); g.connect(lp); lp.connect(window._dry); lp.connect(delay);
  o.start(t); o.stop(t + 0.32);
}
function burst() {
  const base = SCALE[(Math.random() * 4) | 0];
  tone(base, 0.18, "sine"); tone(base * 1.5, 0.12, "triangle"); tone(base * 2, 0.08, "sine");
}
function swell() {
  if (!audioReady) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(320, t + 0.6);
  const g = actx.createGain(); g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.14, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  const lp = actx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(400, t); lp.frequency.exponentialRampToValueAtTime(3000, t + 0.6);
  o.connect(g); g.connect(lp); lp.connect(window._dry); lp.connect(delay);
  o.start(t); o.stop(t + 1.2);
}

// ------------------------------------------------------------------ GL helpers
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const U = (p) => {
  const o = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); o[info.name] = gl.getUniformLocation(p, info.name); }
  return o;
};

const VS_COMMON = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aPhase;
layout(location=2) in float aPot;
uniform mat4 uView; uniform mat4 uProj; uniform float uTime; uniform float uBreath; uniform float uSize;
out float vPot; out float vFog;
vec3 wob(vec3 p){
  float t = uTime * (0.35 + aPhase.y);
  return p + vec3(sin(t + aPhase.x), sin(t*1.3 + aPhase.x*2.0), cos(t*0.9 + aPhase.x)) * 0.055;
}
void main(){
  vec3 p = wob(aPos) * uBreath;
  vec4 vp = uView * vec4(p, 1.0);
  gl_Position = uProj * vp;
  float d = -vp.z;
  vPot = aPot;
  vFog = clamp(1.0 - (d - 2.0) / 15.0, 0.03, 1.0);
  gl_PointSize = clamp(uSize * (1.0 + aPot * 3.5) * (11.0 / d), 1.0, 64.0);
}`;

const FS_POINT = `#version 300 es
precision highp float;
in float vPot; in float vFog; out vec4 frag;
void main(){
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r = dot(uv, uv);
  if (r > 1.0) discard;
  float core = exp(-r * 6.5);
  float halo = exp(-r * 2.2) * 0.10;
  vec3 rest = vec3(0.07, 0.18, 0.48);
  vec3 mid  = vec3(0.14, 0.50, 0.74);
  vec3 hot  = vec3(0.55, 0.72, 0.94);
  vec3 col = mix(rest, mid, smoothstep(0.0, 0.5, vPot));
  col = mix(col, hot, smoothstep(0.5, 1.0, vPot));
  float a = core + halo;
  frag = vec4(col * a * (0.18 + vPot * 0.5) * vFog, a * vFog);
}`;

const FS_LINE = `#version 300 es
precision highp float;
in float vPot; in float vFog; out vec4 frag;
void main(){
  float e = 0.025 + vPot * 0.28;
  vec3 col = mix(vec3(0.03, 0.06, 0.18), vec3(0.22, 0.55, 0.78), clamp(vPot, 0.0, 1.0));
  frag = vec4(col * e * vFog, e * vFog);
}`;

const VS_PULSE = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aLife;
uniform mat4 uView; uniform mat4 uProj; uniform float uBreath;
out float vLife;
void main(){
  vec4 vp = uView * vec4(aPos * uBreath, 1.0);
  gl_Position = uProj * vp;
  float d = -vp.z;
  vLife = aLife;
  gl_PointSize = clamp(70.0 / d, 1.5, 13.0);
}`;
const FS_PULSE = `#version 300 es
precision highp float;
in float vLife; out vec4 frag;
void main(){
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r = dot(uv, uv);
  if (r > 1.0) discard;
  float c = exp(-r * 4.0);
  vec3 col = mix(vec3(0.8, 0.74, 0.48), vec3(0.55, 0.48, 0.8), vLife);
  frag = vec4(col * c * 0.4, c * 0.7);
}`;

const VS_QUAD = `#version 300 es
precision highp float;
layout(location=0) in vec2 aP; out vec2 vUv;
void main(){ vUv = aP * 0.5 + 0.5; gl_Position = vec4(aP, 0.0, 1.0); }`;

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag; uniform sampler2D uTex; uniform float uThresh;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float l = max(max(c.r, c.g), c.b);
  frag = vec4(c * smoothstep(uThresh, uThresh + 0.55, l), 1.0);
}`;
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag; uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec3 a = texture(uTex, vUv).rgb * 0.227027;
  a += texture(uTex, vUv + uDir).rgb * 0.1945946;
  a += texture(uTex, vUv - uDir).rgb * 0.1945946;
  a += texture(uTex, vUv + uDir * 2.0).rgb * 0.1216216;
  a += texture(uTex, vUv - uDir * 2.0).rgb * 0.1216216;
  a += texture(uTex, vUv + uDir * 3.0).rgb * 0.054054;
  a += texture(uTex, vUv - uDir * 3.0).rgb * 0.054054;
  a += texture(uTex, vUv + uDir * 4.0).rgb * 0.016216;
  a += texture(uTex, vUv - uDir * 4.0).rgb * 0.016216;
  frag = vec4(a, 1.0);
}`;
const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform sampler2D uScene; uniform sampler2D uBloom;
uniform float uTime; uniform vec2 uRes; uniform float uFlash; uniform float uBoost;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 d = vUv - 0.5;
  float rad = dot(d, d);
  vec2 ca = d * rad * (0.010 + uBoost * 0.03);
  vec3 s;
  s.r = texture(uScene, vUv + ca).r;
  s.g = texture(uScene, vUv).g;
  s.b = texture(uScene, vUv - ca).b;
  vec3 col = s * 0.75 + texture(uBloom, vUv).rgb * (0.36 + uBoost * 0.6);
  col += uFlash * vec3(0.16, 0.34, 0.6);
  col = aces(col * (0.92 + uBoost * 0.4));
  col *= smoothstep(1.0, 0.16, rad * 1.25);
  col += (hash(gl_FragCoord.xy + uTime * 13.0) - 0.5) * 0.010;
  frag = vec4(col, 1.0);
}`;

const pPoint = prog(VS_COMMON, FS_POINT), uPoint = U(pPoint);
const pLine = prog(VS_COMMON, FS_LINE), uLine = U(pLine);
const pPulse = prog(VS_PULSE, FS_PULSE), uPulse = U(pPulse);
const pBright = prog(VS_QUAD, FS_BRIGHT), uBright = U(pBright);
const pBlur = prog(VS_QUAD, FS_BLUR), uBlur = U(pBlur);
const pComp = prog(VS_QUAD, FS_COMP), uComp = U(pComp);

let posBuf, phaseBuf, potBuf, edgeBuf, vaoPoints, vaoLines, vaoPulse, pulseBuf, edgeCount;

function uploadNetwork() {
  [posBuf, phaseBuf, potBuf, edgeBuf, pulseBuf].forEach((b) => b && gl.deleteBuffer(b));

}
function bindAttr(buf, loc, size) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);

// FBOs
let sceneFBO, bloomA, bloomB;
function mkFBO(w, h, internal, type, filter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { fb, tex, w, h };
}
function rebuildFBOs() {
  [sceneFBO, bloomA, bloomB].forEach((f) => { if (f) { gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); } });
  sceneFBO = mkFBO(BW, BH, SCENE_INTERNAL, SCENE_TYPE, gl.LINEAR);
  const hw = Math.max(1, BW >> 1), hh = Math.max(1, BH >> 1);
  bloomA = mkFBO(hw, hh, SCENE_INTERNAL, SCENE_TYPE, gl.LINEAR);
  bloomB = mkFBO(hw, hh, SCENE_INTERNAL, SCENE_TYPE, gl.LINEAR);
}

}

// ------------------------------------------------------------------ main loop
let pageStart = performance.now();
let last = pageStart;
let acc = 0;
let bootGone = false;

function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.4) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }

  const idle = now - lastInteract > 6000;
  const dreaming = forcedDream || idle;
  if (idle) yaw += dt * (REDUCED ? 0.015 : 0.06);

  spikesThisFrame = 0;

  // spontaneous drive — a homeostatic controller holds activity near a set-point,
  // so the cortex can neither flatline nor run away. Pokes are single & supra-threshold;
  // propagation spreads through the axons as a travelling wave, never a synchronous clump.
  const setPt = (dreaming ? 0.10 : 0.07) * (REDUCED ? 0.6 : 1);
  const drive = Math.max(2, Math.min(42, 7 + (setPt - gAct) * 900));
  let inj = drive * dt;
  while (inj > 0) {
    if (Math.random() < inj) INBOX[(Math.random() * N) | 0] += 1.2;
    inj -= 1;
  }

  // camera matrices
  eye = eyePos();
  const view = lookAt(eye, [0, 0, 0], [0, 1, 0]);
  const proj = perspective(1.05, W / H, 0.1, 60);
  invVP = invert(mul(proj, view));

  regionLabel = ""; regionScreen = null;
  if (hovering && !dragging) {
    const ray = rayFromScreen(mx, my);
    applyProbe(0.09, 0.16, ray);
    const hit = nearestNeuronToRay(ray);
    if (hit) {
      regionLabel = classifyRegion(hit[0], hit[1], hit[2]);
      regionScreen = projectPoint(hit, mul(proj, view));
    }
  }

  // physics — fixed-step, with a hard ceiling so a slow / backgrounded frame
  // can't dump a pile of catch-up steps (which would read as a bright flash)
  updatePulses(dt);
  acc = Math.min(acc + dt, 0.05);
  let steps = 0;
  const h = 1 / 120;
  while (acc >= h && steps < 4) {
    const effThresh = THRESH * (1 + 4.4 * gAct);
    step(h, effThresh);
    acc -= h; steps++;
  }
  const inst = spikesThisFrame / Math.max(dt, 1e-3) / Math.max(N, 1);
  gAct = gAct * 0.82 + Math.min(1, inst * 1.4) * 0.18;

  flash *= 0.86;
  const breath = 1 + 0.015 * Math.sin(now * 0.0011) + 0.03 * gAct;

  // eeg
  eeg[eegHead] = eeg[eegHead] * 0.0 + Math.min(1, spikesThisFrame / (N * 0.02));
  eegHead = (eegHead + 1) % eeg.length;

  // glitch scheduling
  if (!REDUCED && now > glitchNext) { glitchNext = now + 7000 + Math.random() * 9000; if (Math.random() < 0.35) glitchUntil = now + 50 + Math.random() * 80; }

  // ---- upload dynamic buffers
  gl.bindBuffer(gl.ARRAY_BUFFER, potBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, POT);
  gl.bindBuffer(gl.ARRAY_BUFFER, pulseBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, pulseGeo.subarray(0, pCount * 4));

  // ---- render scene to FBO
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb);
  gl.viewport(0, 0, BW, BH);
  gl.clearColor(0.012, 0.014, 0.03, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  // lines
  gl.useProgram(pLine);
  gl.uniformMatrix4fv(uLine.uView, false, view);
  gl.uniformMatrix4fv(uLine.uProj, false, proj);
  gl.uniform1f(uLine.uTime, now * 0.001);
  gl.uniform1f(uLine.uBreath, breath);
  gl.uniform1f(uLine.uSize, 1.0);
  gl.bindVertexArray(vaoLines);
  gl.drawElements(gl.LINES, edgeCount, gl.UNSIGNED_INT, 0);

  // points
  gl.useProgram(pPoint);
  gl.uniformMatrix4fv(uPoint.uView, false, view);
  gl.uniformMatrix4fv(uPoint.uProj, false, proj);
  gl.uniform1f(uPoint.uTime, now * 0.001);
  gl.uniform1f(uPoint.uBreath, breath);
  gl.uniform1f(uPoint.uSize, 1.6 * DPR);
  gl.bindVertexArray(vaoPoints);
  gl.drawArrays(gl.POINTS, 0, N);

  // pulses
  if (pCount > 0) {
    gl.useProgram(pPulse);
    gl.uniformMatrix4fv(uPulse.uView, false, view);
    gl.uniformMatrix4fv(uPulse.uProj, false, proj);
    gl.uniform1f(uPulse.uBreath, breath);
    gl.bindVertexArray(vaoPulse);
    gl.drawArrays(gl.POINTS, 0, pCount);
  }
  gl.bindVertexArray(null);

  // ---- bloom
  gl.disable(gl.BLEND);
  const hw = bloomA.w, hh = bloomA.h;
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
  gl.viewport(0, 0, hw, hh);
  gl.useProgram(pBright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(uBright.uTex, 0);
  gl.uniform1f(uBright.uThresh, BOOST ? 0.5 : 0.85);
  drawQuad();

  for (let i = 0; i < 3; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fb);
    gl.useProgram(pBlur);
    gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform1i(uBlur.uTex, 0);
    gl.uniform2f(uBlur.uDir, 1.4 / hw, 0);
    drawQuad();
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
    gl.bindTexture(gl.TEXTURE_2D, bloomB.tex);
    gl.uniform2f(uBlur.uDir, 0, 1.4 / hh);
    drawQuad();
  }

  // ---- composite to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, BW, BH);
  gl.useProgram(pComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(uComp.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
  gl.uniform1i(uComp.uBloom, 1);
  gl.uniform1f(uComp.uTime, now * 0.001);
  gl.uniform2f(uComp.uRes, BW, BH);
  gl.uniform1f(uComp.uFlash, flash * 0.5);
  gl.uniform1f(uComp.uBoost, BOOST ? 1 : 0);
  drawQuad();

  drawHUD(now, dt, dreaming ? (forcedDream ? "DREAM*" : "DREAM") : "LIVE");

  if (!bootGone && now - pageStart > 900) { boot.classList.add("gone"); bootGone = true; setTimeout(() => boot.remove(), 1200); }
}
function loop(now) { frame(now); requestAnimationFrame(loop); }
function drawQuad() {
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

// ------------------------------------------------------------------ go
if (/\bdream\b/.test(location.search)) forcedDream = true;

resize();
regrow();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
